# Integración continua: se ejecuta en cada Pull Request y en cada push a main o develop.
# Solo verifica (tests y build). Despliegan: Render y Vercel desde main (producción) y
# el job deploy-qa desde develop (pruebas en AWS), solo si las pruebas pasan.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancela la ejecución anterior de la misma rama si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL de prueba, por si los tests usan la base de datos.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack_ci
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fintrack:fintrack_ci@localhost:5432/fintrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades en dependencias de producción (falla con una alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Vulnerabilidades en herramientas de desarrollo (solo informa)
        run: |
          npm audit --audit-level=high >/dev/null 2>&1 && exit 0
          echo "::warning title=npm audit (${PWD##*/})::Hay vulnerabilidades altas o críticas en herramientas de desarrollo (no llegan al despliegue). Revisa 'npm audit' en ${PWD##*/}."
      - run: npm run lint
      # Va antes de `npm test`: sin las tablas, las pruebas con base de datos se omiten sin avisar.
      - name: Validar que el esquema SQL se aplica sobre PostgreSQL
        working-directory: .
        env:
          PGPASSWORD: fintrack_ci
        run: |
          for f in db/init/*.sql; do
            psql -h localhost -U fintrack -d fintrack -v ON_ERROR_STOP=1 -q -f "$f"
          done
          test "$(psql -h localhost -U fintrack -d fintrack -Atc "select count(*) from information_schema.tables where table_schema='public'")" -eq 40
          test "$(psql -h localhost -U fintrack -d fintrack -Atc 'select count(*) from categorias')" -eq 15
      - run: npm test

  frontend:
    name: Frontend (tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades en dependencias de producción (falla con una alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Vulnerabilidades en herramientas de desarrollo (solo informa)
        run: |
          npm audit --audit-level=high >/dev/null 2>&1 && exit 0
          echo "::warning title=npm audit (${PWD##*/})::Hay vulnerabilidades altas o críticas en herramientas de desarrollo (no llegan al despliegue). Revisa 'npm audit' en ${PWD##*/}."
      - run: npm test
      - run: npm run build

  # Ambiente de pruebas (QA) en AWS (FT-0072): solo con push a develop y si las pruebas pasaron.
  # Entra a AWS sin llaves guardadas: GitHub entrega un token OIDC de corta duración y AWS lo cambia
  # por el rol GitHubDeployRole (infra/aws/template.yaml), que solo acepta la rama develop de este
  # repo y solo puede mandar comandos a la instancia de pruebas. Producción no se toca.
  # Configuración (una vez), en Settings > Secrets and variables > Actions > Variables:
  #   AWS_DEPLOY_ROLE_ARN  la salida DeployRoleArn de `./infra/aws/aws.sh status`
  #   AWS_REGION           opcional; por defecto us-east-1
  # Sin AWS_DEPLOY_ROLE_ARN el job se salta.
  deploy-qa:
    name: Desplegar en QA (AWS)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Desplegar y esperar a que la API responda
        run: ./infra/aws/aws.sh deploy develop
      - name: Prueba rápida (health y registro)
        run: ./infra/aws/aws.sh smoke
